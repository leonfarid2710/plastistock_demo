<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leissam — Iniciar sesión</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#0D1F2D;min-height:100vh;display:flex;align-items:center;justify-content:center}

/* fondo decorativo */
.bg-circle1{position:fixed;top:-80px;right:-80px;width:340px;height:340px;border-radius:50%;background:rgba(26,122,94,.15);pointer-events:none}
.bg-circle2{position:fixed;bottom:-60px;left:-60px;width:260px;height:260px;border-radius:50%;background:rgba(37,168,126,.10);pointer-events:none}

.card{background:#fff;border-radius:16px;padding:40px 36px 36px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.35);position:relative;z-index:1}

/* logo */
.logo-wrap{text-align:center;margin-bottom:28px;padding-bottom:22px;border-bottom:1px solid #e5e2da}
.logo-wrap img{width:220px;max-width:100%;height:auto}

/* título */
h1{font-size:15px;font-weight:500;color:#1c1c1a;margin-bottom:22px;text-align:center;letter-spacing:-.1px}

/* form */
.form-group{margin-bottom:14px}
label{display:block;font-size:12px;font-weight:500;color:#6b6860;margin-bottom:5px}
.input-wrap{position:relative}
.input-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:#9e9b95;pointer-events:none}
input{width:100%;padding:10px 13px 10px 34px;border:1px solid #e5e2da;border-radius:8px;font-size:14px;font-family:'DM Sans',sans-serif;color:#1c1c1a;transition:border .15s;background:#fafaf8}
input:focus{outline:none;border-color:#1A7A5E;background:#fff}

.btn{width:100%;padding:12px;background:#1A7A5E;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;margin-top:8px;transition:background .15s;letter-spacing:.02em}
.btn:hover{background:#155c3e}
.btn:active{transform:scale(.99)}

.error{background:#fdf0ee;color:#a32d2d;border:1px solid #f7c1c1;border-radius:8px;padding:10px 13px;font-size:13px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.hint{text-align:center;font-size:11px;color:#9e9b95;margin-top:18px;font-family:'DM Mono',monospace}
</style>
</head>
<body>
<div class="bg-circle1"></div>
<div class="bg-circle2"></div>

<div class="card">
  <div class="logo-wrap">
    <img src="/static/logo.png" alt="Distribuidora Leissam Plásticos y Derivados">
  </div>

  <h1>Iniciar sesión</h1>

  {% if error %}
  <div class="error">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="16" height="16"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    {{ error }}
  </div>
  {% endif %}

  <form method="post">
    <div class="form-group">
      <label>Usuario</label>
      <div class="input-wrap">
        <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <input type="text" name="usuario" placeholder="admin" autocomplete="username" required autofocus>
      </div>
    </div>
    <div class="form-group">
      <label>Contraseña</label>
      <div class="input-wrap">
        <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input type="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>
    </div>
    <button class="btn" type="submit">Entrar al sistema</button>
  </form>

  <div class="hint">Sistema de Inventarios · Demo v1.0</div>
</div>
</body>
</html>
