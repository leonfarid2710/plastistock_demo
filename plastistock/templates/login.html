<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leissam — Iniciar sesión</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#f4f2ee;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#fff;border:1px solid #e5e2da;border-radius:14px;padding:40px 36px;width:100%;max-width:380px;box-shadow:0 4px 24px rgba(0,0,0,.06)}
.logo{text-align:center;margin-bottom:28px}
.logo-name{font-size:22px;font-weight:600;color:#1a6b4a;letter-spacing:-.3px}
.logo-sub{font-size:12px;color:#9e9b95;margin-top:2px}
h1{font-size:16px;font-weight:500;color:#1c1c1a;margin-bottom:20px;text-align:center}
.form-group{margin-bottom:14px}
label{display:block;font-size:12px;font-weight:500;color:#6b6860;margin-bottom:5px}
input{width:100%;padding:10px 13px;border:1px solid #e5e2da;border-radius:7px;font-size:14px;font-family:'DM Sans',sans-serif;color:#1c1c1a;transition:border .15s}
input:focus{outline:none;border-color:#1a6b4a}
.btn{width:100%;padding:11px;background:#1a6b4a;color:#fff;border:none;border-radius:7px;font-size:14px;font-weight:500;font-family:'DM Sans',sans-serif;cursor:pointer;margin-top:6px;transition:background .15s}
.btn:hover{background:#155c3e}
.error{background:#fdf0ee;color:#a32d2d;border:1px solid #f7c1c1;border-radius:7px;padding:10px 13px;font-size:13px;margin-bottom:14px}
.hint{text-align:center;font-size:11px;color:#9e9b95;margin-top:18px;font-family:'DM Mono',monospace}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-name">Leissam</div>
    <div class="logo-sub">Plásticos y Derivados</div>
  </div>
  <h1>Iniciar sesión</h1>
  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}
  <form method="post">
    <div class="form-group">
      <label>Usuario</label>
      <input type="text" name="usuario" placeholder="admin" autocomplete="username" required autofocus>
    </div>
    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
    </div>
    <button class="btn" type="submit">Entrar</button>
  </form>
  <div class="hint">Sistema de Inventarios · Demo v1.0</div>
</div>
</body>
</html>
